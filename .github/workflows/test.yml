name: Reproducibility and regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BDM_INSTALL: 060d86f1078a10eb0b547d717976c96edf10e3d7
      OMP_NUM_THREADS: 1
      OMP_DYNAMIC: 'FALSE'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Install pinned BioDynaMo
        run: |
          curl --fail --location "https://raw.githubusercontent.com/BioDynaMo/biodynamo/$BDM_INSTALL/util/install" --output "$RUNNER_TEMP/install-bdm.sh"
          # BioDynaMo's CI branch assumes its own GHA_REPOSITORY/GHA_BRANCH_NAME.
          # Use the standalone checkout path for this downstream project.
          # Override setup-python's 3.12 root hint for BioDynaMo's exact 3.9.1 dependency.
          env -u GITHUB_ACTIONS SILENT_INSTALL=1 BDM_CMAKE_FLAGS="-Dnotebooks=off -DPython_EXECUTABLE=$HOME/.pyenv/versions/3.9.1/bin/python -DPython_ROOT_DIR=$HOME/.pyenv/versions/3.9.1" bash "$RUNNER_TEMP/install-bdm.sh"
      - name: Build and test
        run: |
          export PYTHON="$(command -v python)"
          source "$HOME/biodynamo-v1.05.169/bin/thisbdm.sh"
          biodynamo --version
          export LD_LIBRARY_PATH="$PWD/build:$("$BDMSYS/third_party/root/bin/root-config" --libdir):$BDMSYS/lib:${LD_LIBRARY_PATH:-}"
          bash tests/test.sh
