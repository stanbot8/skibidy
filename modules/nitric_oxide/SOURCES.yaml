# Literature sources for nitric_oxide module
wound_nitric_oxide:
  description: iNOS-derived nitric oxide as immune antimicrobial effector and vasodilator in wound healing
  sources:
  - id: schaffer1996
    authors: Schaffer MR, Tantry U, Gross SS, Wasserkrug HL, Barbul A
    year: 1996
    title: Nitric oxide regulates wound healing
    journal: J Surg Res 63(1):237-240
    doi: 10.1006/jsre.1996.0254
    notes: NOS inhibition reduced wound collagen accumulation and breaking strength. Does not support blanket collagen suppression by NO.
  - id: witte2000
    authors: Witte MB, Thornton FJ, Efron DT, Barbul A
    year: 2000
    title: Enhancement of fibroblast collagen synthesis by nitric oxide
    journal: Nitric Oxide 4(6):572-582
    doi: 10.1006/niox.2000.0307
    notes: SNAP increased dermal fibroblast collagen synthesis. Donor doses cannot be mapped to the model's arbitrary-unit NO field.
  - id: obayashi2006
    authors: Obayashi K, Akamatsu H, Okano Y, Matsunaga K, Masaki H
    year: 2006
    title: Exogenous nitric oxide enhances the synthesis of type I collagen and heat shock protein 47 by normal human dermal fibroblasts
    journal: J Dermatol Sci 41(2):121-126
    doi: 10.1016/j.jdermsci.2005.08.004
    notes: NO donors enhanced type I collagen synthesis in normal human dermal fibroblasts. Supports a context-dependent synthesis role, not a quantitative response in model units.
  - id: witte2002
    authors: Witte MB, Barbul A
    year: 2002
    title: Role of nitric oxide in wound repair
    journal: Am J Surg 183(4):406-412
    doi: 10.1016/s0002-9610(02)00815-2
    notes: 'iNOS produces sustained NO from M1 macrophages and neutrophils during inflammation phase.
      Qualitative source rationale only. Production magnitudes are assumed.

      '
  - id: luo2005
    authors: Luo JD, Chen AF
    year: 2005
    title: Nitric oxide, a newly discovered function on wound healing
    journal: Acta Pharmacol Sin 26(3):259-264
    doi: 10.1111/j.1745-7254.2005.00058.x
    notes: 'NO activates soluble guanylyl cyclase in vascular smooth muscle, mediating vasodilation
      and improved perfusion. The model coupling strength is assumed.

      '
  - id: witte2002b
    authors: Witte MB, Kiyama T, Barbul A
    year: 2002
    title: Nitric oxide enhances experimental wound healing in diabetes
    journal: Br J Surg 89(12):1594-1601
    doi: 10.1046/j.1365-2168.2002.02263.x
    notes: 'NO donor treatment enhanced collagen accumulation and wound breaking strength in diabetic rats.
      Does not establish a fixed 40% per-cell iNOS reduction. The diabetic production modifier is assumed.

      '
